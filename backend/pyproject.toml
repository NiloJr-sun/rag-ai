[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-ai-backend"
version = "0.1.0"
description = "RAG pipeline: chunking, embeddings, retrieval and generation over Supabase/pgvector + Ollama"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Remaining runtime deps land per ticket (supabase at T1.4, fastapi at T2.1).
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
