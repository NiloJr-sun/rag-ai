name: Type check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Keyed on the workflow name as well as the ref, so these five do not cancel
# each other out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend

      - name: mypy
        run: mypy backend
