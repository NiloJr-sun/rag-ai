name: Set up backend
description: Install Python and the backend package with its dev extras.

# Shared by every workflow so the Python version and install command live in
# one place. Requires actions/checkout to have run first.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/pyproject.toml

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e "backend[dev]"
